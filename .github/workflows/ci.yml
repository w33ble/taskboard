name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Lint frontend (oxlint)
        working-directory: web
        run: npm run lint

      - name: Check frontend formatting
        working-directory: web
        run: npm run fmt:check

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Embed frontend
        run: |
          mkdir -p cmd/taskboard/web/dist
          cp -r web/dist/* cmd/taskboard/web/dist/

      - name: Build binary
        run: go build -o taskboard ./cmd/taskboard

      - name: Verify binary
        run: ./taskboard --help

      - name: Run Go tests
        run: go test ./...
